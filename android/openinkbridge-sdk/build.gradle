plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

def sdkVersion = "0.1.3"

android {
    namespace 'org.openinkbridge.sdk'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 4
        versionName sdkVersion
        buildConfigField "String", "SDK_VERSION", "\"${sdkVersion}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        test.resources.srcDir "$rootDir/../contracts"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    // 1.13 provides origin-scoped WebMessageListener support while remaining compatible with
    // this project's Kotlin 1.9 / AGP 8.2 lint toolchain.
    implementation "androidx.webkit:webkit:1.13.0"
    
    // Google's Jetpack Ink API for low-latency drawing fallback
    implementation "androidx.input:input-motionprediction:1.0.0"
    
    // Onyx Pen SDK for hardware-level low latency drawing
    // Compile against the vendor API without forcing it into every consumer. Applications that
    // want Onyx acceleration opt in with the matching runtime dependency (see android/README.md).
    compileOnly "com.onyx.android.sdk:onyxsdk-pen:1.5.4"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

task inspectOnyxClasses {
    doLast {
        def urls = []
        configurations.debugCompileClasspath.each { urls << it.toURI().toURL() }
        def classLoader = new URLClassLoader(urls as URL[], this.class.classLoader)
        
        // Inspect RawInputCallback
        def callbackClass = classLoader.loadClass("com.onyx.android.sdk.pen.RawInputCallback")
        println "=== Methods of com.onyx.android.sdk.pen.RawInputCallback ==="
        callbackClass.getDeclaredMethods().each { method ->
            println method.toString()
        }
        
        // Inspect TouchPointList
        def listClass = classLoader.loadClass("com.onyx.android.sdk.pen.data.TouchPointList")
        println "=== Methods of com.onyx.android.sdk.pen.data.TouchPointList ==="
        listClass.getDeclaredMethods().each { method ->
            println method.toString()
        }

        // Inspect TouchHelper
        def helperClass = classLoader.loadClass("com.onyx.android.sdk.pen.TouchHelper")
        println "=== Methods of com.onyx.android.sdk.pen.TouchHelper ==="
        helperClass.getDeclaredMethods().each { method ->
            println method.toString()
        }
    }
}
