name: Android Sample Debug APK Prerelease

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Run repository verification gate
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    permissions:
      contents: read

  build-debug-apk:
    name: Build debug-signed sample APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tags to point to main history
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit in main history."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Stage debug APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/openinkbridge-sample-debug.apk
          cd release
          sha256sum openinkbridge-sample-debug.apk > openinkbridge-sample-debug.apk.sha256

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenInkBridge-Sample-Debug-APK
          path: release/
          if-no-files-found: error

  release:
    name: Publish debug APK prerelease
    if: github.ref_type == 'tag'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download sample APK
        uses: actions/download-artifact@v4
        with:
          name: OpenInkBridge-Sample-Debug-APK
          path: release
      - name: Create GitHub debug APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/openinkbridge-sample-debug.apk
            release/openinkbridge-sample-debug.apk.sha256
          prerelease: true
          fail_on_unmatched_files: true
          title: "OpenInkBridge Sample Debug APK ${{ github.ref_name }}"
          body: |
            ## OpenInkBridge Sample Debug APK ${{ github.ref_name }}
            
            This is a debuggable, debug-signed sample build for testing on E-Ink Android devices. It is not a production-signed SDK release. The CI debug signing identity is not a stable update identity, so installing a later build may require uninstalling the previous sample first.
            
            ### Installation Instructions:
            1. Download `openinkbridge-sample-debug.apk` and optionally verify its SHA-256 checksum.
            2. Open **Storage / File Manager** on your device and tap the APK to install.
